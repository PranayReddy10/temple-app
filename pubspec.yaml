name: temple_app
description: Temple pilgrimage companion for India. Discover temples, plan yatras, collect stamps.
publish_to: "none"
version: 0.6.0+6

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  youtube_player_iframe: ^5.2.1
  webview_flutter: ^4.10.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4
  crypto: ^3.0.7
  package_info_plus: ^9.0.1
  razorpay_flutter: ^1.4.7
  flutter_cashfree_pg_sdk: ^2.4.0+52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Synthesised by tool/make_temple_bell.py; no recording, no licence.
    - assets/sounds/
  # Noto fonts, SIL Open Font License 1.1 (see assets/fonts/OFL.txt). Bundled
  # so Devanagari and Telugu render on every platform without a CDN fetch.
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif_400Regular.ttf
        - asset: assets/fonts/NotoSerif_600SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans_400Regular.ttf
        - asset: assets/fonts/NotoSans_700Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu_400Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil_400Regular.ttf
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada_400Regular.ttf
