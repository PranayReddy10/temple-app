<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="temple_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>temple_app</title>
  <link rel="manifest" href="manifest.json">
  <!-- The page is the temple-door teak while the app loads, with a slow
       brass pulse, rather than a white page that looks broken. -->
  <style>
    html, body { margin: 0; height: 100%; background: #3E2723; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .3s; }
    #loading div { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, #F7E29C, #C9A227 60%, #8C6A10); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.8); opacity: .6; } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
