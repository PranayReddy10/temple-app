<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Darshan Saathi: darshan timings, puja and seva booking, dress code and directions for Hindu temples across India, with bhajans, a temple passport and yatra planning.">
  <link rel="canonical" href="https://darshansaathi.com/">
  <meta property="og:site_name" content="Darshan Saathi">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Darshan Saathi: your temple companion">
  <meta property="og:description" content="Darshan timings, puja and seva booking, and directions for temples across India.">
  <meta property="og:url" content="https://darshansaathi.com/">
  <meta property="og:image" content="https://darshansaathi.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Darshan Saathi","url":"https://darshansaathi.com/","description":"Darshan timings, puja and seva booking, and directions for Hindu temples across India."}</script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Darshan Saathi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Darshan Saathi: temple timings, puja booking and directions</title>
  <link rel="manifest" href="manifest.json">
  <!-- The page is the temple-door teak while the app loads, with a slow
       brass pulse, rather than a white page that looks broken. -->
  <style>
    html, body { margin: 0; height: 100%; background: #3E2723; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .3s; }
    #loading div { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, #F7E29C, #C9A227 60%, #8C6A10); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.8); opacity: .6; } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading"><div></div></div>
  <!-- What search engines and link previews read: the app itself draws on a
       canvas they cannot. Removed once the app's first frame is up. -->
  <main id="seo" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">
    <h1>Darshan Saathi: your temple companion</h1>
    <p>Darshan timings, puja and seva booking, dress code and directions for Hindu temples across India, with bhajans, a temple passport and yatra planning.</p>
    <p><a href="/temples">Browse all temples</a> · <a href="/sitemap.xml">Sitemap</a></p>
  </main>
  <noscript>
    <p style="color:#fff;font-family:sans-serif;padding:16px">Darshan Saathi needs JavaScript. <a style="color:#F7E29C" href="/temples">Browse the temple directory</a> instead.</p>
  </noscript>
  <script>
    // The engine reads the browser's languages with Intl.Locale, and one
    // tag it cannot parse (some in-app browsers send odd ones, some send
    // none) stops the app before its first frame. Keep only valid tags.
    (function () {
      try {
        var ok = [], dropped = false;
        var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < langs.length; i++) {
          try { new Intl.Locale(langs[i]); ok.push(langs[i]); } catch (e) { dropped = true; }
        }
        if (!ok.length) { ok = ['en-IN']; dropped = true; }
        if (dropped || !navigator.languages || !navigator.languages.length) {
          Object.defineProperty(navigator, 'languages', { get: function () { return ok; } });
          Object.defineProperty(navigator, 'language', { get: function () { return ok[0]; } });
        }
      } catch (e) {}
    })();

    // If the app has not drawn within 20 seconds, say so, with the error,
    // rather than leaving a loading screen that looks like it might still come.
    var bootErrors = [];
    window.addEventListener('error', function (e) { bootErrors.push(String((e && (e.message || (e.target && e.target.src))) || e)); }, true);
    window.addEventListener('unhandledrejection', function (e) { bootErrors.push(String(e && e.reason)); });
    var started = false;
    setTimeout(function () {
      if (started) return;
      var el = document.getElementById('loading');
      if (!el) return;
      el.innerHTML = '<div style="width:auto;height:auto;border-radius:0;background:none;animation:none;max-width:360px;padding:24px;color:#F5EBDC;font-family:system-ui,sans-serif;text-align:center">'
        + '<p style="font-size:18px;margin:0 0 8px">Darshan Saathi could not start in this browser.</p>'
        + '<p style="margin:0 0 12px;opacity:.8">Try reloading, or another browser. Meanwhile, <a style="color:#F7E29C" href="/temples">browse the temple directory</a>.</p>'
        + '<pre style="white-space:pre-wrap;text-align:left;font-size:11px;opacity:.7;max-height:40vh;overflow:auto">' + (bootErrors.slice(0, 5).join('\n').replace(/</g, '&lt;') || 'No error was reported.') + '</pre></div>';
    }, 20000);

    window.addEventListener('flutter-first-frame', function () {
      started = true;
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
      var seo = document.getElementById('seo');
      if (seo) { seo.remove(); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
